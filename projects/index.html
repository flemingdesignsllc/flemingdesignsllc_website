<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rouge+Script&display=swap" rel="stylesheet">
  <title>Fleming Design Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFBF6;
      font-family: "Rouge Script", cursive;
    }

    .rouge-script-regular {
      font-family: "Rouge Script", cursive;
      font-weight: 400;
      font-style: normal;
    }

    header {
      position: relative;
      width: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: none;
    }

    header img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center;
      margin: 0;
    }

    header h1 {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: #1A0F00;
      text-shadow: 0 2px 10px rgba(255,255,255,0.7);
      font-size: clamp(2.5rem, 5vw, 4rem);
      z-index: 1;
      white-space: nowrap;
    }

    nav {
      background-color: #004225;
      padding: 10px;
      text-align: center;
    }

    nav button {
      background-color: #056937;
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 5px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      cursor: pointer;
    }

    nav button:hover {
      background-color: #1e965a;
    }

    section {
      padding: 20px;
      text-align: center;
    }
    .gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  max-width: 1000px;
  margin: 0 auto;
}

.gallery img {
  display: block;
  width: 100%;
  height: auto;
}
 </style>
</head>
<body>

  <header>
    <img src="snipped_SN_2.png" alt="Fleming Design Studio banner">
    <h1>Fleming Design Studio</h1>
  </header>

  <nav>
    <button onclick="window.location.href='../index.html'">Home</button>
    <button onclick="window.location.href='./projects/'">In process works</button>
    <button onclick="window.location.href='./Gallery/'">Gallery</button>
    <button onclick="window.location.href='./CommissionWork/'">Commissions</button>
    <button onclick="window.location.href='./Contact/'">Contact Me</button>
  </nav>


  <section id="in-process">
  <h2>In Process Works</h2>
  <div class="gallery">
    <img src="PXL_20261019_124041664.RAW-01.jpg" alt="In process woodburning">
    <img src="PXL_20261025_131805770.RAW-01.jpg" alt="In process woodburning">
  </div>
</section>

</body>
</html>
