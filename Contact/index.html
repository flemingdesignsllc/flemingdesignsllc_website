<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rouge+Script&display=swap" rel="stylesheet">
  <title>Fleming Design Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFBF6;
      font-family: "Rouge Script", cursive;
    }

    .rouge-script-regular {
      font-family: "Rouge Script", cursive;
      font-weight: 400;
      font-style: normal;
    }

    header {
      position: relative;
      width: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      background: none;
    }

    header img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center;
      margin: 0;
    }

    header h1 {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: #1A0F00;
      text-shadow: 0 2px 10px rgba(255,255,255,0.7);
      font-size: clamp(2.5rem, 5vw, 4rem);
      z-index: 1;
      white-space: nowrap;
    }

    nav {
      background-color: #004225;
      padding: 10px;
      text-align: center;
    }

    nav button {
      background-color: #056937;
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 5px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      cursor: pointer;
    }

    nav button:hover {
      background-color: #1e965a;
    }

    section {
      padding: 20px;
      text-align: center;
    }

    form {
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
    }

    form label {
      display: block;
      margin-bottom: 5px;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
    }

    form input,
    form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 15px;
      padding: 8px;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
    }

    form button {
      background-color: #056937;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    form button:hover {
      background-color: #1e965a;
    }

    #form-status {
      color: #000000;
      font-family: "Times New Roman", Times, serif;
    }
  </style>
</head>
<body>

  <header>
    <img src="../snipped_SN_2.png" alt="Fleming Design Studio banner">
    <h1>Fleming Design Studio</h1>
  </header>

  <nav>
    <button onclick="window.location.href='../index.html'">Home</button>
    <button onclick="window.location.href='../projects/'">In process works</button>
    <button onclick="window.location.href='../Gallery/'">Gallery</button>
    <button onclick="window.location.href='../CommissionWork/'">Commissions</button>
    <button onclick="window.location.href='../Contact/'">Contact Me</button>
  </nav>

  <section id="contact">
    <h2>Contact Me</h2>
    <p id="form-status"></p>
    <form action="/api/contact" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">

      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById("form-status");
    if (params.get("sent")) {
      status.textContent = "Thank you! Your message was sent.";
    }
    if (params.get("error")) {
      status.textContent = "Sorry, something went wrong. Please try again.";
    }
  </script>

</body>
</html>
